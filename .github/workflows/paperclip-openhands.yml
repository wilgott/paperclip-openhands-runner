# Public runner for Paperclip → OpenHands.
# Workflow is public; secrets stay in Actions settings.
# The job clones private wilgott/klinky.io, works there, and can push a branch/PR.

name: Paperclip OpenHands

run-name: "Paperclip OpenHands ${{ inputs.run_marker }}"

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Task prompt from Paperclip
        required: true
        type: string
      run_marker:
        description: Unique marker paperclip-run-<uuid>
        required: true
        type: string
      target_repo:
        description: Private repo to clone and push to (owner/name)
        required: false
        default: "wilgott/klinky.io"
        type: string
      target_ref:
        description: Branch to start from
        required: false
        default: "main"
        type: string
      paperclip_api_url:
        description: Paperclip base URL (Tailscale IP)
        required: false
        default: "http://100.118.240.21:3100"
        type: string
      paperclip_api_key:
        required: false
        default: ""
        type: string
      paperclip_run_id:
        required: false
        default: ""
        type: string
      paperclip_issue_id:
        required: false
        default: ""
        type: string
      paperclip_agent_id:
        required: false
        default: ""
        type: string
      paperclip_company_id:
        required: false
        default: ""
        type: string
      paperclip_agent_name:
        required: false
        default: "Dev"
        type: string

permissions:
  contents: read

concurrency:
  group: paperclip-openhands-${{ github.ref }}
  cancel-in-progress: false

jobs:
  openhands:
    name: OpenHands on ubuntu-latest (+ Tailscale → private repo)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout runner repo (workflow only)
        uses: actions/checkout@v4

      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: gha-paperclip-oh-${{ github.run_id }}

      - name: Notify Paperclip — starting
        if: inputs.paperclip_api_url != '' && inputs.paperclip_api_key != '' && inputs.paperclip_issue_id != ''
        continue-on-error: true
        env:
          PAPERCLIP_API_URL: ${{ inputs.paperclip_api_url }}
          PAPERCLIP_API_KEY: ${{ inputs.paperclip_api_key }}
          PAPERCLIP_ISSUE_ID: ${{ inputs.paperclip_issue_id }}
          PAPERCLIP_RUN_ID: ${{ inputs.paperclip_run_id }}
          PAPERCLIP_AGENT_NAME: ${{ inputs.paperclip_agent_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TARGET_REPO: ${{ inputs.target_repo }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          agent = os.environ.get("PAPERCLIP_AGENT_NAME") or "Agent"
          repo = os.environ.get("TARGET_REPO") or "the repo"
          body = (
              f"## Plan\n\n"
              f"{agent} is on the GitHub runner and will execute this issue with OpenHands.\n\n"
              f"I will:\n"
              f"- Read the issue and GitHub repo `{repo}` (Paperclip is tickets only)\n"
              f"- Implement the requested work in this run\n"
              f"- Push or update a PR on GitHub if files change\n"
              f"- Comment again when finished\n\n"
              f"Links:\n"
              f"- Actions: {os.environ['RUN_URL']}\n"
          )
          url = os.environ["PAPERCLIP_API_URL"].rstrip("/") + f"/api/issues/{os.environ['PAPERCLIP_ISSUE_ID']}/comments"
          headers = {
              "Authorization": f"Bearer {os.environ['PAPERCLIP_API_KEY']}",
              "Content-Type": "application/json",
              "Accept": "application/json",
          }
          run_id = os.environ.get("PAPERCLIP_RUN_ID", "").strip()
          if run_id:
              headers["X-Paperclip-Run-Id"] = run_id
          req = urllib.request.Request(url, data=json.dumps({"body": body}).encode(), headers=headers, method="POST")
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  print("Paperclip starting comment status", resp.status)
          except urllib.error.HTTPError as exc:
              print("Paperclip starting comment failed:", exc.code, exc.read()[:400], file=__import__("sys").stderr)
              raise
          PY

      - name: Checkout private target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repo }}
          ref: ${{ inputs.target_ref }}
          token: ${{ secrets.KLINKY_REPO_TOKEN }}
          path: workspace
          fetch-depth: 0

      - name: Continue existing Paperclip PR branch when possible
        working-directory: workspace
        env:
          GH_TOKEN: ${{ secrets.KLINKY_REPO_TOKEN }}
          TARGET_REPO: ${{ inputs.target_repo }}
          ISSUE_ID: ${{ inputs.paperclip_issue_id }}
        run: |
          set -euo pipefail
          if [ -z "$ISSUE_ID" ]; then
            echo "No Paperclip issue id; staying on ${{ inputs.target_ref }}"
            exit 0
          fi
          BRANCH=$(gh pr list --repo "$TARGET_REPO" --state open --limit 50 \
            --json headRefName,body,updatedAt \
            --jq "[.[] | select((.body // \"\") | contains(\"$ISSUE_ID\"))] | sort_by(.updatedAt) | reverse | .[0].headRefName // empty" \
            || true)
          if [ -z "$BRANCH" ]; then
            echo "No open PR mentions this issue; staying on current ref"
            exit 0
          fi
          echo "Checking out existing PR branch $BRANCH"
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install OpenHands CLI
        run: uv tool install openhands --python 3.12

      - name: Install image tooling for asset tasks
        run: |
          python3 -m pip install --user pillow
          python3 -c "from PIL import Image, ImageDraw, ImageFont; print('pillow-ok')"

      - name: Write task prompt
        working-directory: workspace
        env:
          PROMPT: ${{ inputs.prompt }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          pathlib.Path("paperclip-task.txt").write_text(os.environ["PROMPT"], encoding="utf-8")
          print(f"Wrote paperclip-task.txt ({len(os.environ['PROMPT'])} chars)")
          PY

      - name: Configure git identity
        working-directory: workspace
        run: |
          git config user.name "paperclip-openhands[bot]"
          git config user.email "paperclip-openhands[bot]@users.noreply.github.com"

      - name: Run OpenHands headless
        working-directory: workspace
        env:
          LLM_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          LLM_MODEL: ${{ vars.PAPERCLIP_OH_LLM_MODEL || 'openai/commandcode-combo' }}
          LLM_BASE_URL: ${{ vars.PAPERCLIP_OH_LLM_BASE_URL || 'http://100.86.141.107:20128/v1' }}
          RUNTIME: local
          AGENT_ENABLE_PROMPT_EXTENSIONS: "false"
          OPENHANDS_SUPPRESS_BANNER: "1"
          TTY_COMPATIBLE: "1"
          PAPERCLIP_API_URL: ${{ inputs.paperclip_api_url }}
          PAPERCLIP_API_KEY: ${{ inputs.paperclip_api_key }}
          PAPERCLIP_RUN_ID: ${{ inputs.paperclip_run_id }}
          PAPERCLIP_ISSUE_ID: ${{ inputs.paperclip_issue_id }}
          PAPERCLIP_TASK_ID: ${{ inputs.paperclip_issue_id }}
          PAPERCLIP_AGENT_ID: ${{ inputs.paperclip_agent_id }}
          PAPERCLIP_COMPANY_ID: ${{ inputs.paperclip_company_id }}
          PAPERCLIP_AGENT_NAME: ${{ inputs.paperclip_agent_name }}
          GH_TOKEN: ${{ secrets.KLINKY_REPO_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.KLINKY_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${LLM_API_KEY:-}" ]; then
            echo "OMNIROUTE_API_KEY secret is missing" >&2
            exit 1
          fi
          echo "LLM_MODEL=$LLM_MODEL"
          echo "LLM_BASE_URL=$LLM_BASE_URL"
          echo "target=${{ inputs.target_repo }}@${{ inputs.target_ref }}"
          echo "agent=${PAPERCLIP_AGENT_NAME:-unknown}"
          echo "paperclip_issue_id_set=$([ -n "${PAPERCLIP_ISSUE_ID:-}" ] && echo yes || echo no)"
          echo "cwd=$(pwd)"
          code=$(curl -sS -o /tmp/llm-models.json -w "%{http_code}" -m 20 \
            -H "Authorization: Bearer ${LLM_API_KEY}" \
            "${LLM_BASE_URL%/}/models" || true)
          echo "LLM /models HTTP $code"
          if [ "$code" != "200" ]; then
            echo "LLM endpoint probe failed (Tailscale + OmniRoute?)" >&2
            head -c 400 /tmp/llm-models.json || true
            echo
            exit 1
          fi
          # OpenHands github skill expects GITHUB_TOKEN
          export GITHUB_TOKEN="${GITHUB_TOKEN:-$GH_TOKEN}"
          export GH_TOKEN="${GH_TOKEN:-$GITHUB_TOKEN}"
          openhands --headless --json --streaming --override-with-envs --exit-without-confirmation \
            -f paperclip-task.txt | tee openhands-events.jsonl
          test -s openhands-events.jsonl || {
            echo "openhands produced no event output" >&2
            exit 1
          }
          if command -v rg >/dev/null 2>&1; then
            if rg -q '"code": "AuthenticationError"' openhands-events.jsonl; then
              echo "OpenHands AuthenticationError — see artifact" >&2
              exit 1
            fi
          fi

      - name: Upload OpenHands event log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openhands-events-${{ inputs.run_marker }}
          path: workspace/openhands-events.jsonl
          if-no-files-found: ignore

      - name: Push branch if OpenHands changed files
        if: success()
        working-directory: workspace
        env:
          GH_TOKEN: ${{ secrets.KLINKY_REPO_TOKEN }}
          RUN_MARKER: ${{ inputs.run_marker }}
          TARGET_REPO: ${{ inputs.target_repo }}
        run: |
          set -euo pipefail
          # Drop the prompt file from the commit unless the agent intentionally kept it
          git status --porcelain
          ISSUE_ID="${{ inputs.paperclip_issue_id }}"
          link_existing_pr() {
            local found=""
            if [ -z "$ISSUE_ID" ]; then
              echo "No Paperclip issue id; cannot attach an existing PR"
              return 0
            fi
            found=$(gh pr list --repo "$TARGET_REPO" --state open --limit 50 \
              --json url,body,updatedAt \
              --jq "[.[] | select((.body // \"\") | contains(\"$ISSUE_ID\"))] | sort_by(.updatedAt) | reverse | .[0].url // empty" \
              || true)
            if [ -n "$found" ]; then
              printf '%s\n' "$found" > paperclip-pr-url.txt
              echo "Linking existing PR ${found}"
            else
              echo "No open PR body mentions this Paperclip issue"
            fi
          }
          if [ -z "$(git status --porcelain)" ]; then
            echo "No file changes to push"
            link_existing_pr
            exit 0
          fi
          BRANCH="paperclip/oh-${RUN_MARKER}"
          # sanitize branch name
          BRANCH=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._/-]/-/g' | cut -c1-200)
          git checkout -B "$BRANCH"
          git add -A
          git reset HEAD -- paperclip-task.txt openhands-events.jsonl 2>/dev/null || true
          # Untracked transient files still show in porcelain; only commit if something is staged
          if [ -z "$(git diff --cached --name-only)" ]; then
            echo "Only transient files changed; nothing to push"
            link_existing_pr
            exit 0
          fi
          git commit -m "paperclip: OpenHands changes (${RUN_MARKER})"
          git push -u "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git" "HEAD:${BRANCH}"
          PR_BODY="Automated OpenHands run from public runner paperclip-openhands-runner.

          Marker: ${RUN_MARKER}
          Paperclip issue: ${ISSUE_ID}
          Actions: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PR_URL=""
          if gh pr create --repo "$TARGET_REPO" \
            --title "Paperclip OpenHands: ${RUN_MARKER}" \
            --body "$PR_BODY" \
            --base "${{ inputs.target_ref }}" \
            --head "$BRANCH"; then
            PR_URL=$(gh pr view --repo "$TARGET_REPO" --head "$BRANCH" --json url -q .url || true)
          else
            echo "PR create skipped (may already exist)"
            PR_URL=$(gh pr view --repo "$TARGET_REPO" --head "$BRANCH" --json url -q .url || true)
          fi
          printf '%s\n' "$PR_URL" > paperclip-pr-url.txt
          echo "PR_URL=${PR_URL:-none}"

      - name: Summarize for Paperclip
        if: always() && inputs.paperclip_api_url != '' && inputs.paperclip_api_key != '' && inputs.paperclip_issue_id != ''
        continue-on-error: true
        env:
          PAPERCLIP_API_URL: ${{ inputs.paperclip_api_url }}
          PAPERCLIP_API_KEY: ${{ inputs.paperclip_api_key }}
          PAPERCLIP_ISSUE_ID: ${{ inputs.paperclip_issue_id }}
          PAPERCLIP_RUN_ID: ${{ inputs.paperclip_run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_CONCLUSION: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.error, urllib.request

          def extract_summary(path):
              last = ""
              try:
                  for raw in pathlib.Path(path).read_text(encoding="utf-8", errors="replace").splitlines():
                      raw = raw.strip()
                      if not raw:
                          continue
                      try:
                          ev = json.loads(raw)
                      except json.JSONDecodeError:
                          continue
                      if not isinstance(ev, dict):
                          continue
                      for key in ("message", "content", "text"):
                          val = ev.get(key)
                          if isinstance(val, str) and len(val.strip()) > 40:
                              last = val.strip()
                          elif isinstance(val, list):
                              texts = [p.get("text", "") for p in val if isinstance(p, dict) and p.get("text")]
                              joined = "\n".join(texts).strip()
                              if len(joined) > 40:
                                  last = joined
                      args = ev.get("args") if isinstance(ev.get("args"), dict) else {}
                      if isinstance(args.get("content"), str) and len(args["content"].strip()) > 40:
                          last = args["content"].strip()
              except FileNotFoundError:
                  return ""
              return last[:2000]

          pr = ""
          pr_path = pathlib.Path("workspace/paperclip-pr-url.txt")
          if pr_path.exists():
              pr = pr_path.read_text(encoding="utf-8").strip()
          summary = extract_summary("workspace/openhands-events.jsonl")
          lines = [
              "## Update",
              "",
              f"OpenHands GitHub Actions run **{os.environ.get('JOB_CONCLUSION', 'finished')}**.",
              "",
          ]
          if summary:
              lines.extend([summary, ""])
          lines.append("Links:")
          lines.append(f"- Actions: {os.environ['RUN_URL']}")
          if pr:
              lines.append(f"- PR: {pr}")
          body = "\n".join(lines) + "\n"
          url = os.environ["PAPERCLIP_API_URL"].rstrip("/") + f"/api/issues/{os.environ['PAPERCLIP_ISSUE_ID']}/comments"
          headers = {
              "Authorization": f"Bearer {os.environ['PAPERCLIP_API_KEY']}",
              "Content-Type": "application/json",
              "Accept": "application/json",
          }
          run_id = os.environ.get("PAPERCLIP_RUN_ID", "").strip()
          if run_id:
              headers["X-Paperclip-Run-Id"] = run_id
          req = urllib.request.Request(url, data=json.dumps({"body": body}).encode(), headers=headers, method="POST")
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  print("Paperclip finish comment status", resp.status)
          except urllib.error.HTTPError as exc:
              print("Paperclip finish comment failed:", exc.code, exc.read()[:400], file=__import__("sys").stderr)
              raise
          PY
